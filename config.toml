# Command run inside the pseudo-terminal the controllers type into.
command = ["claude", "agents"]

# How many controllers to wait for before starting (2 for a Zwift Play or Click v2, 1 for a Click).
controllers = 2

long_press_ms = 500   # hold this long to trigger a `long` binding
long_repeat_ms = 150  # then repeat the `long` key this often while held
hold_repeat_ms = 30   # `hold` bindings repeat this often, like keyboard auto-repeat

# Button -> key. Keys: up down left right home end pageup pagedown enter escape
# space tab shift+tab backspace ctrl+<letter>, or any single character.
#   "key"                         sent on press
#   { tap = "k", long = "k2" }    tap on short press, k2 (repeating) on long press
#   { hold = "k" }                repeated while held; for push-to-talk
#
# Buttons: navigationUp/Down/Left/Right, onOffLeft, sideButtonLeft, paddleLeft (left Play),
# a, b, y, z, onOffRight, sideButtonRight, paddleRight (right Play),
# shiftUpLeft, shiftUpRight (Click v2 shift buttons; Click minus/plus; Play firmware 2 side buttons),
# shiftDownLeft, shiftDownRight, powerUpLeft, powerUpRight (Zwift Ride).
[buttons]
navigationLeft = "left"                                   # back to the agent list
navigationRight = "right"                                 # attach to selected session
navigationUp = { tap = "up", long = "pageup" }            # previous session / scroll
navigationDown = { tap = "down", long = "pagedown" }      # next session / scroll
a = "enter"                                               # attach / send / dispatch
b = "escape"                                              # close peek / clear / interrupt
y = { hold = "space" }                                    # push-to-talk (voice mode "hold" on Space)
z = "space"                                               # peek at selected session
paddleLeft = "1"                                          # option 1
paddleRight = "2"                                         # option 2 (or "shift+tab" for permission mode)
shiftUpLeft = "1"                                         # option 1 (Click v2 left shift)
shiftUpRight = "2"                                        # option 2 (Click v2 right shift)
